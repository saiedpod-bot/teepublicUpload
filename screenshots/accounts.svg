<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="row1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#162032"/>
      <stop offset="100%" stop-color="#1a2538"/>
    </linearGradient>
    <linearGradient id="row2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c2838"/>
      <stop offset="100%" stop-color="#1f2d3d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="780" height="500" fill="url(#bg)" rx="12"/>

  <!-- Title Bar -->
  <rect x="0" y="0" width="780" height="45" rx="12" fill="#1e293b"/>
  <rect x="0" y="22" width="780" height="23" fill="#1e293b"/>
  <text x="20" y="28" fill="#ffffff" font-size="16" font-weight="bold">Account Manager</text>
  <text x="430" y="28" fill="#94a3b8" font-size="11">Manage your TeePublic accounts</text>

  <!-- Add Account Button -->
  <rect x="620" y="10" width="140" height="28" rx="6" fill="#3b82f6"/>
  <text x="690" y="30" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">+ Add Account</text>

  <!-- Table Header -->
  <rect x="20" y="60" width="740" height="32" rx="6" fill="#1e293b"/>
  <text x="40" y="81" fill="#94a3b8" font-size="11" font-weight="bold">#</text>
  <text x="70" y="81" fill="#94a3b8" font-size="11" font-weight="bold">Email</text>
  <text x="230" y="81" fill="#94a3b8" font-size="11" font-weight="bold">Store Name</text>
  <text x="390" y="81" fill="#94a3b8" font-size="11" font-weight="bold">Status</text>
  <text x="480" y="81" fill="#94a3b8" font-size="11" font-weight="bold">Password</text>
  <text x="600" y="81" fill="#94a3b8" font-size="11" font-weight="bold">Notes</text>
  <text x="700" y="81" fill="#94a3b8" font-size="11" font-weight="bold">Actions</text>

  <!-- Row 1 -->
  <rect x="20" y="92" width="740" height="36" rx="4" fill="url(#row1)"/>
  <text x="40" y="115" fill="#e2e8f0" font-size="11">1</text>
  <text x="70" y="115" fill="#e2e8f0" font-size="11">artist_01@example.com</text>
  <text x="230" y="115" fill="#e2e8f0" font-size="11">Vintage Threads</text>
  <rect x="390" y="100" width="55" height="18" rx="9" fill="#166534"/>
  <text x="417" y="113" text-anchor="middle" fill="#4ade80" font-size="10">Active</text>
  <text x="480" y="115" fill="#94a3b8" font-size="11">●●●●●●●●</text>
  <circle cx="492" cy="115" r="5" fill="#64748b"/>
  <text x="492" y="119" text-anchor="middle" fill="#fff" font-size="7">👁</text>
  <text x="600" y="115" fill="#94a3b8" font-size="11">—</text>
  <circle cx="700" cy="110" r="7" fill="#3b82f6"/>
  <text x="700" y="115" text-anchor="middle" fill="#fff" font-size="9">✎</text>
  <circle cx="725" cy="110" r="7" fill="#ef4444"/>
  <text x="725" y="115" text-anchor="middle" fill="#fff" font-size="9">✕</text>

  <!-- Row 2 -->
  <rect x="20" y="128" width="740" height="36" rx="4" fill="url(#row2)"/>
  <text x="40" y="151" fill="#e2e8f0" font-size="11">2</text>
  <text x="70" y="151" fill="#e2e8f0" font-size="11">artist_02@example.com</text>
  <text x="230" y="151" fill="#e2e8f0" font-size="11">Neon Culture</text>
  <rect x="390" y="136" width="55" height="18" rx="9" fill="#166534"/>
  <text x="417" y="149" text-anchor="middle" fill="#4ade80" font-size="10">Active</text>
  <text x="480" y="151" fill="#94a3b8" font-size="11">●●●●●●●●</text>
  <circle cx="492" cy="151" r="5" fill="#64748b"/>
  <text x="492" y="155" text-anchor="middle" fill="#fff" font-size="7">👁</text>
  <text x="600" y="151" fill="#94a3b8" font-size="11">—</text>
  <circle cx="700" cy="146" r="7" fill="#3b82f6"/>
  <text x="700" y="151" text-anchor="middle" fill="#fff" font-size="9">✎</text>
  <circle cx="725" cy="146" r="7" fill="#ef4444"/>
  <text x="725" y="151" text-anchor="middle" fill="#fff" font-size="9">✕</text>

  <!-- Row 3 -->
  <rect x="20" y="164" width="740" height="36" rx="4" fill="url(#row1)"/>
  <text x="40" y="187" fill="#e2e8f0" font-size="11">3</text>
  <text x="70" y="187" fill="#e2e8f0" font-size="11">artist_03@example.com</text>
  <text x="230" y="187" fill="#e2e8f0" font-size="11">Retro Vibes</text>
  <rect x="390" y="172" width="55" height="18" rx="9" fill="#991b1b"/>
  <text x="417" y="185" text-anchor="middle" fill="#fca5a5" font-size="10">Closed</text>
  <text x="480" y="187" fill="#94a3b8" font-size="11">●●●●●●●●</text>
  <circle cx="492" cy="187" r="5" fill="#64748b"/>
  <text x="492" y="191" text-anchor="middle" fill="#fff" font-size="7">👁</text>
  <text x="600" y="187" fill="#94a3b8" font-size="11">Stores full</text>
  <circle cx="700" cy="182" r="7" fill="#3b82f6"/>
  <text x="700" y="187" text-anchor="middle" fill="#fff" font-size="9">✎</text>
  <circle cx="725" cy="182" r="7" fill="#ef4444"/>
  <text x="725" y="187" text-anchor="middle" fill="#fff" font-size="9">✕</text>

  <!-- Row 4 -->
  <rect x="20" y="200" width="740" height="36" rx="4" fill="url(#row2)"/>
  <text x="40" y="223" fill="#e2e8f0" font-size="11">4</text>
  <text x="70" y="223" fill="#e2e8f0" font-size="11">artist_04@example.com</text>
  <text x="230" y="223" fill="#e2e8f0" font-size="11">Pixel Perfect</text>
  <rect x="390" y="208" width="55" height="18" rx="9" fill="#166534"/>
  <text x="417" y="221" text-anchor="middle" fill="#4ade80" font-size="10">Active</text>
  <text x="480" y="223" fill="#94a3b8" font-size="11">●●●●●●●●</text>
  <circle cx="492" cy="223" r="5" fill="#64748b"/>
  <text x="492" y="227" text-anchor="middle" fill="#fff" font-size="7">👁</text>
  <text x="600" y="223" fill="#94a3b8" font-size="11">—</text>
  <circle cx="700" cy="218" r="7" fill="#3b82f6"/>
  <text x="700" y="223" text-anchor="middle" fill="#fff" font-size="9">✎</text>
  <circle cx="725" cy="218" r="7" fill="#ef4444"/>
  <text x="725" y="223" text-anchor="middle" fill="#fff" font-size="9">✕</text>

  <!-- Row 5 -->
  <rect x="20" y="236" width="740" height="36" rx="4" fill="url(#row1)"/>
  <text x="40" y="259" fill="#e2e8f0" font-size="11">5</text>
  <text x="70" y="259" fill="#e2e8f0" font-size="11">artist_05@example.com</text>
  <text x="230" y="259" fill="#e2e8f0" font-size="11">Cosmic Art</text>
  <rect x="390" y="244" width="55" height="18" rx="9" fill="#166534"/>
  <text x="417" y="257" text-anchor="middle" fill="#4ade80" font-size="10">Active</text>
  <text x="480" y="259" fill="#94a3b8" font-size="11">●●●●●●●●</text>
  <circle cx="492" cy="259" r="5" fill="#64748b"/>
  <text x="492" y="263" text-anchor="middle" fill="#fff" font-size="7">👁</text>
  <text x="600" y="259" fill="#94a3b8" font-size="11">—</text>
  <circle cx="700" cy="254" r="7" fill="#3b82f6"/>
  <text x="700" y="259" text-anchor="middle" fill="#fff" font-size="9">✎</text>
  <circle cx="725" cy="254" r="7" fill="#ef4444"/>
  <text x="725" y="259" text-anchor="middle" fill="#fff" font-size="9">✕</text>

  <!-- Bottom Bar -->
  <rect x="20" y="285" width="740" height="40" rx="6" fill="#1e293b"/>

  <rect x="30" y="293" width="120" height="24" rx="4" fill="#059669"/>
  <text x="90" y="310" text-anchor="middle" fill="#fff" font-size="11">Export to Excel</text>

  <text x="200" y="310" fill="#94a3b8" font-size="11">5 accounts (4 Active / 1 Closed)</text>

  <rect x="420" y="293" width="80" height="24" rx="4" fill="#854d0e"/>
  <text x="460" y="310" text-anchor="middle" fill="#facc15" font-size="11">Refresh</text>

  <rect x="510" y="293" width="80" height="24" rx="4" fill="#64748b"/>
  <text x="550" y="310" text-anchor="middle" fill="#fff" font-size="11">Clear All</text>

  <!-- Legend / Help text -->
  <rect x="20" y="340" width="740" height="80" rx="8" fill="#0f172a" stroke="#333" stroke-width="1"/>
  <text x="40" y="365" fill="#94a3b8" font-size="11" font-weight="bold">About Account Manager</text>
  <text x="40" y="385" fill="#64748b" font-size="10">• Each account is assigned one design upload at a time</text>
  <text x="40" y="400" fill="#64748b" font-size="10">• Green = Active (ready to upload), Red = Closed (skipped)</text>
  <text x="40" y="415" fill="#64748b" font-size="10">• Export to Excel downloads an .xlsx file with all account data</text>

  <!-- Watermark -->
  <text x="770" y="495" text-anchor="end" fill="#ffffff" fill-opacity="0.06" font-size="9" font-weight="bold">© SaiedPod</text>
</svg>
