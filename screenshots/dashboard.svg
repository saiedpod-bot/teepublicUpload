<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0f0f"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="700" fill="url(#bg)" rx="12"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="1000" height="48" fill="#1e1e1e" rx="12"/>
  <rect x="0" y="30" width="1000" height="18" fill="#1e1e1e"/>
  <circle cx="20" cy="24" r="6" fill="#ef4444"/>
  <circle cx="38" cy="24" r="6" fill="#eab308"/>
  <circle cx="56" cy="24" r="6" fill="#22c55e"/>
  <text x="500" y="29" text-anchor="middle" fill="#94a3b8" font-size="13">TeePublic Uploader  —  http://localhost:3030</text>

  <!-- Header -->
  <text x="30" y="82" fill="#4ade80" font-size="22" font-weight="bold">📤  TeePublic Uploader  <tspan fill="#94a3b8" font-size="14" font-weight="normal">AI-powered batch upload</tspan></text>

  <!-- Step 1: API Key -->
  <rect x="30" y="100" width="940" height="90" rx="8" fill="#1a1a2e" stroke="#333" stroke-width="1"/>
  <rect x="30" y="100" width="940" height="30" rx="8" fill="#16213e"/>
  <text x="50" y="120" fill="#60a5fa" font-size="13" font-weight="bold">①  Gemini API Key</text>
  <text x="850" y="120" fill="#4ade80" font-size="11">✅ Saved</text>

  <input x="50" y="145" width="600" height="32" rx="6" fill="#0d1117" stroke="#444"/>
  <text x="60" y="165" fill="#6b7280" font-size="12">AIza...</text>
  <rect x="670" y="145" width="70" height="32" rx="6" fill="#3b82f6"/>
  <text x="705" y="165" text-anchor="middle" fill="#fff" font-size="12">Save</text>
  <text x="50" y="180" fill="#6b7280" font-size="10">Get a free key at aistudio.google.com/apikey</text>

  <!-- Step 2: Dropzone -->
  <rect x="30" y="200" width="940" height="70" rx="8" fill="#1a1a2e" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="8,4"/>
  <rect x="30" y="200" width="940" height="30" rx="8" fill="#16213e"/>
  <text x="50" y="220" fill="#60a5fa" font-size="13" font-weight="bold">②  Design Images</text>
  <text x="800" y="220" fill="#4ade80" font-size="11">✅ 51 images staged</text>
  <text x="500" y="250" text-anchor="middle" fill="#6b7280" font-size="13">📁  Drop .png / .jpg files or a .zip folder of designs</text>

  <!-- Step 3: Prompt -->
  <rect x="30" y="280" width="940" height="90" rx="8" fill="#1a1a2e" stroke="#333" stroke-width="1"/>
  <rect x="30" y="280" width="940" height="30" rx="8" fill="#16213e"/>
  <text x="50" y="300" fill="#60a5fa" font-size="13" font-weight="bold">③  Prompt  <tspan fill="#6b7280" font-size="11">(optional)</tspan></text>
  <text x="850" y="300" fill="#eab308" font-size="11">Auto-derive from image</text>

  <rect x="50" y="320" width="900" height="36" rx="6" fill="#0d1117" stroke="#333"/>
  <text x="60" y="342" fill="#6b7280" font-size="12">Leave empty to auto-derive from image. Or describe the theme...</text>

  <!-- Step 4: Generate button area -->
  <rect x="30" y="380" width="940" height="50" rx="8" fill="#1a1a2e" stroke="#4ade80" stroke-width="1"/>
  <rect x="50" y="392" width="160" height="28" rx="6" fill="#4ade80"/>
  <text x="130" y="411" text-anchor="middle" fill="#000" font-size="12" font-weight="bold">🚀 Generate 51 listings</text>
  <text x="230" y="411" fill="#4ade80" font-size="12">Auto-generates when you drop images ✓</text>

  <!-- Step 5: Design preview -->
  <rect x="30" y="445" width="940" height="120" rx="8" fill="#1a1a2e" stroke="#333" stroke-width="1"/>
  <rect x="30" y="445" width="940" height="30" rx="8" fill="#16213e"/>
  <text x="50" y="465" fill="#60a5fa" font-size="13" font-weight="bold">④  Design Preview &amp; Configuration</text>
  <text x="850" y="465" fill="#4ade80" font-size="11">Design 3 of 51 <tspan fill="#6b7280">‹  ›</tspan></text>

  <!-- Design card mini -->
  <rect x="50" y="485" width="80" height="70" rx="6" fill="#0d1117" stroke="#333"/>
  <circle cx="90" cy="520" r="25" fill="#2d1b69"/>
  <text x="90" y="545" text-anchor="middle" fill="#6b7280" font-size="8">design_03.png</text>

  <!-- Form fields -->
  <rect x="150" y="485" width="300" height="22" rx="4" fill="#0d1117" stroke="#333"/>
  <text x="155" y="500" fill="#cbd5e1" font-size="11">Hawaii Volleyball Champions 2026</text>
  <rect x="150" y="512" width="300" height="22" rx="4" fill="#0d1117" stroke="#333"/>
  <text x="155" y="527" fill="#cbd5e1" font-size="11">hawaii-volleyball</text>
  <rect x="150" y="539" width="300" height="22" rx="4" fill="#0d1117" stroke="#333"/>
  <text x="155" y="554" fill="#6b7280" font-size="11">Supporting tags: hawaii, volleyball, champion, sport, tropical...</text>

  <!-- Color swatches -->
  <rect x="480" y="485" width="460" height="70" rx="6" fill="#0d1117" stroke="#333"/>
  <text x="490" y="505" fill="#94a3b8" font-size="11">Color presets:</text>
  <circle cx="495" cy="525" r="10" fill="#fff" stroke="#ccc"/>
  <circle cx="520" cy="525" r="10" fill="#000"/>
  <circle cx="545" cy="525" r="10" fill="#ef4444"/>
  <circle cx="570" cy="525" r="10" fill="#3b82f6"/>
  <circle cx="595" cy="525" r="10" fill="#22c55e"/>
  <circle cx="620" cy="525" r="10" fill="#eab308"/>
  <circle cx="645" cy="525" r="10" fill="#a855f7"/>
  <circle cx="670" cy="525" r="10" fill="#f97316"/>
  <text x="490" y="545" fill="#94a3b8" font-size="10">+ 12 more colors  |  Tab: Info / Colors / Products</text>

  <!-- Bottom bar -->
  <rect x="30" y="580" width="940" height="55" rx="8" fill="#1a1a2e" stroke="#333" stroke-width="1"/>
  <text x="50" y="608" fill="#94a3b8" font-size="13"><tspan fill="#4ade80" font-size="18" font-weight="bold">49</tspan>  / 51 designs ready</text>

  <rect x="680" y="593" width="130" height="30" rx="6" fill="#3b82f6"/>
  <text x="745" y="613" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">💾 Import</text>

  <rect x="830" y="593" width="130" height="30" rx="6" fill="#4ade80"/>
  <text x="895" y="613" text-anchor="middle" fill="#000" font-size="12" font-weight="bold">📤 Send to extension</text>

  <!-- Footer step numbers overlay -->
  <text x="30" y="665" fill="#6b7280" font-size="11">① Add API key  →  ② Drop images  →  ③ Review metadata AI-generated  →  ④ Send to Chrome extension  →  ⑤ Auto-publish on TeePublic</text>

  <!-- Numbered step bubbles on the side -->
  <circle cx="15" cy="134" r="10" fill="#3b82f6"/>
  <text x="15" y="138" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">1</text>
  <circle cx="15" cy="245" r="10" fill="#3b82f6"/>
  <text x="15" y="249" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">2</text>
  <circle cx="15" cy="325" r="10" fill="#6b7280"/>
  <text x="15" y="329" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">3</text>
  <circle cx="15" cy="405" r="10" fill="#4ade80"/>
  <text x="15" y="409" text-anchor="middle" fill="#000" font-size="10" font-weight="bold">4</text>
  <circle cx="15" cy="505" r="10" fill="#4ade80"/>
  <text x="15" y="509" text-anchor="middle" fill="#000" font-size="10" font-weight="bold">5</text>
  <circle cx="15" cy="607" r="10" fill="#a855f7"/>
  <text x="15" y="611" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">6</text>
</svg>