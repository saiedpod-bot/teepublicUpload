<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0f0f"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="boxDash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0d2137"/>
    </linearGradient>
    <linearGradient id="boxExt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a2a"/>
      <stop offset="100%" stop-color="#0a1f15"/>
    </linearGradient>
    <linearGradient id="boxTP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a1a1a"/>
      <stop offset="100%" stop-color="#1f0a0a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="500" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#4ade80" font-size="18" font-weight="bold">System Architecture</text>

  <!-- Dashboard Box -->
  <rect x="60" y="80" width="260" height="160" rx="12" fill="url(#boxDash)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="190" y="115" text-anchor="middle" fill="#60a5fa" font-size="15" font-weight="bold">🖥  Dashboard</text>
  <text x="190" y="138" text-anchor="middle" fill="#94a3b8" font-size="11">Next.js 15 · localhost:3030</text>
  <line x1="90" y1="150" x2="290" y2="150" stroke="#333" stroke-width="1"/>
  <text x="85" y="170" fill="#cbd5e1" font-size="11">• Drop images + CSV/xlsx</text>
  <text x="85" y="188" fill="#cbd5e1" font-size="11">• Generate metadata via Gemini AI</text>
  <text x="85" y="206" fill="#cbd5e1" font-size="11">• Preview &amp; send to extension</text>
  <text x="85" y="224" fill="#cbd5e1" font-size="11">• Edit colors, products per design</text>

  <!-- Chrome Extension Box -->
  <rect x="320" y="80" width="260" height="160" rx="12" fill="url(#boxExt)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="450" y="115" text-anchor="middle" fill="#4ade80" font-size="15" font-weight="bold">🧩  Chrome Extension</text>
  <text x="450" y="138" text-anchor="middle" fill="#94a3b8" font-size="11">MV3 · Service Worker + Popup</text>
  <line x1="350" y1="150" x2="550" y2="150" stroke="#333" stroke-width="1"/>
  <text x="345" y="170" fill="#cbd5e1" font-size="11">• Receives queue from dashboard</text>
  <text x="345" y="188" fill="#cbd5e1" font-size="11">• Stores in chrome.storage.local</text>
  <text x="345" y="206" fill="#cbd5e1" font-size="11">• Opens TeePublic tabs</text>
  <text x="345" y="224" fill="#cbd5e1" font-size="11">• Injects content script</text>

  <!-- TeePublic Box -->
  <rect x="580" y="80" width="260" height="160" rx="12" fill="url(#boxTP)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="710" y="115" text-anchor="middle" fill="#f87171" font-size="15" font-weight="bold">🌐  TeePublic.com</text>
  <text x="710" y="138" text-anchor="middle" fill="#94a3b8" font-size="11">Upload · Edit · Publish</text>
  <line x1="610" y1="150" x2="810" y2="150" stroke="#333" stroke-width="1"/>
  <text x="605" y="170" fill="#cbd5e1" font-size="11">• Upload artwork</text>
  <text x="605" y="188" fill="#cbd5e1" font-size="11">• Fill title/description/tags</text>
  <text x="605" y="206" fill="#cbd5e1" font-size="11">• Set colors + positions</text>
  <text x="605" y="224" fill="#cbd5e1" font-size="11">• Click Publish</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Dashboard → Extension -->
  <line x1="320" y1="140" x2="320" y2="140" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="290" y="70" text-anchor="middle" fill="#3b82f6" font-size="10">QUEUE_INIT / QUEUE_IMAGE</text>
  <line x1="320" y1="120" x2="320" y2="160" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="320" y1="160" x2="270" y2="200" stroke="#3b82f6" stroke-width="2"/>
  <line x1="270" y1="200" x2="320" y2="200" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Let me redo arrows properly -->
  <line x1="320" y1="160" x2="270" y2="200" stroke="#3b82f6" stroke-width="2"/>
  
  <!-- Arrow: Dashboard → Extension -->
  <path d="M 320 160 Q 240 200 320 240" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)" stroke-dasharray="6,3"/>
  <text x="205" y="205" text-anchor="middle" fill="#3b82f6" font-size="10" transform="rotate(-20, 205, 205)">QUEUE_INIT</text>

  <!-- Arrow: Extension → TeePublic -->
  <path d="M 580 160 Q 660 200 580 240" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)" stroke-dasharray="6,3" transform="scale(-1, 1) translate(-1160, 0)"/>
  
  <!-- Better arrows using simple lines -->
  <!-- Dashboard → Extension -->
  <line x1="320" y1="170" x2="320" y2="300" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="330" y="290" fill="#3b82f6" font-size="11">Queue items + images</text>

  <!-- Extension → TeePublic -->
  <line x1="450" y1="240" x2="450" y2="360" stroke="#22c55e" stroke-width="2.5"/>
  <line x1="450" y1="360" x2="580" y2="360" stroke="#22c55e" stroke-width="2.5"/>
  <line x1="580" y1="360" x2="580" y2="240" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="515" y="355" text-anchor="middle" fill="#22c55e" font-size="11">Open tab · Inject content script</text>

  <!-- User input area -->
  <rect x="60" y="330" width="260" height="120" rx="10" fill="#1a1a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="190" y="360" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="bold">👤  User Input</text>
  <line x1="90" y1="370" x2="290" y2="370" stroke="#333" stroke-width="1"/>
  <text x="80" y="390" fill="#cbd5e1" font-size="11">• 51 designs in EPS+PNG OLD</text>
  <text x="80" y="408" fill="#cbd5e1" font-size="11">• CSV metadata file</text>
  <text x="80" y="426" fill="#cbd5e1" font-size="11">• 50 TeePublic accounts</text>
  <text x="80" y="444" fill="#cbd5e1" font-size="11">• Gemini API key</text>

  <!-- User → Dashboard arrow -->
  <path d="M 60 390 Q 30 390 40 250 Q 50 180 60 160" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowBlue)"/>
  <text x="20" y="280" fill="#a78bfa" font-size="10" transform="rotate(-90, 20, 280)">Drop files + config</text>
  <!-- Watermark -->
  <text x="880" y="490" text-anchor="end" fill="#ffffff" fill-opacity="0.08" font-size="10" font-weight="bold">© SaiedPod</text>
</svg>