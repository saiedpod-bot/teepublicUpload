<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeePublic Uploader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #e0e0e0; padding: 24px; max-width: 900px; margin: 0 auto; }
    h1 { font-size: 24px; margin-bottom: 16px; color: #4ade80; }
    h2 { font-size: 18px; margin: 24px 0 12px; color: #94a3b8; border-bottom: 1px solid #333; padding-bottom: 8px; }
    .section { background: #1a1a1a; border-radius: 8px; padding: 20px; margin-bottom: 16px; border: 1px solid #333; }
    label { display: block; font-weight: 600; margin-bottom: 6px; color: #cbd5e1; }
    input[type="file"] { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #444; border-radius: 6px; color: #e0e0e0; cursor: pointer; }
    input[type="file"]:hover { border-color: #4ade80; }
    .btn { display: inline-block; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; margin: 4px; }
    .btn-primary { background: #4ade80; color: #000; }
    .btn-primary:hover { background: #22c55e; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { padding: 12px; background: #0d1117; border-radius: 6px; margin-top: 12px; font-family: monospace; font-size: 13px; max-height: 200px; overflow-y: auto; white-space: pre-wrap; }
    .success { color: #4ade80; }
    .error { color: #ef4444; }
    .info { color: #60a5fa; }
    #preview { margin-top: 16px; }
    .design-card { display: inline-block; width: 120px; margin: 6px; text-align: center; }
    .design-card img { width: 120px; height: 120px; object-fit: contain; border-radius: 6px; border: 1px solid #333; }
    .design-card .name { font-size: 11px; margin-top: 4px; color: #94a3b8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .design-card.matched { border: 2px solid #4ade80; border-radius: 8px; }
    .design-card.unmatched { opacity: 0.4; }
    .ext-status { padding: 8px 12px; border-radius: 6px; font-weight: 600; margin-bottom: 12px; }
    .ext-connected { background: #064e3b; color: #4ade80; border: 1px solid #4ade80; }
    .ext-disconnected { background: #450a0a; color: #fca5a5; border: 1px solid #ef4444; }
  </style>
</head>
<body>
  <h1>TeePublic Uploader</h1>

  <div id="extStatus" class="ext-section ext-disconnected">Checking extension...</div>

  <div class="section">
    <h2>1. Load Metadata</h2>
    <label>CSV file (filename, title, primary_tag, description, supporting_tags)</label>
    <input type="file" id="csvInput" accept=".csv">
    <div id="csvInfo" style="margin-top:8px; color:#94a3b8; font-size:13px;"></div>
  </div>

  <div class="section">
    <h2>2. Load Images</h2>
    <label>PNG files (select all designs at once)</label>
    <input type="file" id="pngInput" accept="image/png" multiple>
    <div id="pngInfo" style="margin-top:8px; color:#94a3b8; font-size:13px;"></div>
  </div>

  <div class="section">
    <h2>3. Preview &amp; Upload</h2>
    <div id="matchedInfo"></div>
    <div id="preview"></div>
    <div style="margin-top: 16px;">
      <button class="btn btn-primary" id="startBtn" disabled>Start Upload</button>
      <button class="btn btn-danger" id="clearBtn">Clear All</button>
    </div>
    <div id="status"></div>
  </div>

  <script>
    // ── Config ──
    const EXTENSION_ID_KEY = "teepublic.extensionId";
    let extensionId = localStorage.getItem(EXTENSION_ID_KEY) || "";

    // ── State ──
    let csvRows = [];
    let pngFiles = [];
    let matchedDesigns = [];

    // ── DOM refs ──
    const extStatus = document.getElementById("extStatus");
    const csvInput = document.getElementById("csvInput");
    const csvInfo = document.getElementById("csvInfo");
    const pngInput = document.getElementById("pngInput");
    const pngInfo = document.getElementById("pngInfo");
    const matchedInfo = document.getElementById("matchedInfo");
    const preview = document.getElementById("preview");
    const startBtn = document.getElementById("startBtn");
    const clearBtn = document.getElementById("clearBtn");
    const status = document.getElementById("status");

    // ── Extension ID prompt ──
    if (!extensionId) {
      extensionId = prompt("Enter your TeePublic Extension ID (from chrome://extensions):") || "";
      if (extensionId) localStorage.setItem(EXTENSION_ID_KEY, extensionId.trim());
    }

    // ── Extension check ──
    async function checkExtension() {
      if (!extensionId) {
        extStatus.className = "ext-status ext-disconnected";
        extStatus.textContent = "No Extension ID — refresh to set it";
        return;
      }
      try {
        const r = await sendMsg({ type: "PING" });
        if (r?.ok) {
          extStatus.className = "ext-status ext-connected";
          extStatus.textContent = "Extension connected: " + extensionId.substring(0, 12) + "...";
        } else throw new Error("bad response");
      } catch {
        extStatus.className = "ext-status ext-disconnected";
        extStatus.textContent = "Extension NOT connected — install it and reload this page";
      }
    }
    checkExtension();

    // ── Chrome runtime wrapper ──
    function sendMsg(msg) {
      return new Promise((resolve, reject) => {
        try {
          chrome.runtime.sendMessage(extensionId, msg, (resp) => {
            if (chrome.runtime.lastError) return reject(new Error(chrome.runtime.lastError.message));
            resolve(resp);
          });
        } catch (e) { reject(e); }
      });
    }

    // ── CSV parsing ──
    csvInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const text = ev.target.result;
        const lines = text.split("\n").filter(l => l.trim());
        if (lines.length < 2) { csvInfo.textContent = "CSV is empty"; return; }
        const headers = lines[0].split(",").map(h => h.trim().toLowerCase());
        csvRows = [];
        for (let i = 1; i < lines.length; i++) {
          const vals = parseCSVLine(lines[i]);
          const row = {};
          headers.forEach((h, idx) => row[h] = (vals[idx] || "").trim());
          if (row.filename || row.title) csvRows.push(row);
        }
        csvInfo.innerHTML = `<span class="success">Loaded ${csvRows.length} designs from CSV</span>`;
        matchAndPreview();
      };
      reader.readAsText(file);
    });

    function parseCSVLine(line) {
      const result = [];
      let current = "";
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') { inQuotes = !inQuotes; }
        else if (ch === "," && !inQuotes) { result.push(current); current = ""; }
        else { current += ch; }
      }
      result.push(current);
      return result;
    }

    // ── PNG file handling ──
    pngInput.addEventListener("change", (e) => {
      pngFiles = Array.from(e.target.files);
      pngInfo.innerHTML = `<span class="success">Loaded ${pngFiles.length} PNG files</span>`;
      matchAndPreview();
    });

    // ── Match CSV rows with PNG files ──
    function stem(name) {
      return name.toLowerCase().replace(/\.png$/i, "").trim();
    }

    function matchAndPreview() {
      preview.innerHTML = "";
      matchedDesigns = [];
      if (csvRows.length === 0 || pngFiles.length === 0) {
        matchedInfo.textContent = csvRows.length === 0 && pngFiles.length === 0
          ? "Load a CSV and PNG files to begin"
          : csvRows.length === 0 ? "Load a CSV first" : "Load PNG files first";
        startBtn.disabled = true;
        return;
      }

      // Build PNG lookup by stem
      const pngMap = new Map();
      for (const f of pngFiles) {
        pngMap.set(stem(f.name), f);
      }

      let matched = 0;
      for (const row of csvRows) {
        const csvStem = stem(row.filename || "");
        // Try exact stem match, then partial match
        let pngFile = pngMap.get(csvStem);
        if (!pngFile) {
          for (const [k, v] of pngMap) {
            if (k.includes(csvStem) || csvStem.includes(k)) { pngFile = v; break; }
          }
        }

        const card = document.createElement("div");
        card.className = "design-card" + (pngFile ? " matched" : " unmatched");

        const img = document.createElement("img");
        if (pngFile) {
          img.src = URL.createObjectURL(pngFile);
          matched++;
          matchedDesigns.push({ row, file: pngFile });
        } else {
          img.src = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><rect fill="#333" width="120" height="120"/><text fill="#666" x="60" y="65" text-anchor="middle" font-size="12">No PNG</text></svg>');
        }

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = row.title || row.filename || "?";
        name.title = row.filename;

        card.appendChild(img);
        card.appendChild(name);
        preview.appendChild(card);
      }

      matchedInfo.innerHTML = `<strong>${matched}/${csvRows.length}</strong> designs matched with PNGs`;
      startBtn.disabled = matched === 0;
    }

    // ── Start Upload ──
    startBtn.addEventListener("click", async () => {
      if (!extensionId) { log("ERROR: No extension ID", "error"); return; }
      if (matchedDesigns.length === 0) { log("ERROR: No matched designs", "error"); return; }

      startBtn.disabled = true;
      log("Building queue...", "info");

      // Build QueueBatch
      const batch = {
        id: "batch-" + Date.now(),
        createdAt: Date.now(),
        items: matchedDesigns.map((d, i) => ({
          id: `design-${i}-${Date.now()}`,
          metadata: {
            filename: d.file.name,
            title: d.row.title || "",
            description: d.row.description || "",
            primaryTag: d.row.primary_tag || "",
            tags: (d.row.supporting_tags || "").split(/[,;]/).map(s => s.trim()).filter(Boolean),
            matureContent: false,
            productColors: {},
            enabledProducts: [],
          },
          imageUrl: "",
          imageMime: "image/png",
          imageSizeBytes: d.file.size,
          status: "pending",
          selected: true,
          attempts: 0,
          createdAt: Date.now(),
          updatedAt: Date.now(),
        })),
        source: {
          spreadsheetName: "designs_metadata.csv",
          rowCount: csvRows.length,
          matchedCount: matchedDesigns.length,
        },
      };

      // Send QUEUE_INIT (without images)
      try {
        const lightBatch = { ...batch, items: batch.items.map(it => ({ ...it, imageUrl: "" })) };
        const initRes = await sendMsg({ type: "QUEUE_INIT", batch: lightBatch });
        if (!initRes?.ok) throw new Error(initRes?.error || "init failed");
        log("Queue initialized: " + batch.items.length + " designs", "success");

        // Send each image
        for (let i = 0; i < matchedDesigns.length; i++) {
          const d = matchedDesigns[i];
          const dataUrl = await fileToDataUrl(d.file);
          const imgRes = await sendMsg({ type: "QUEUE_IMAGE", itemId: batch.items[i].id, imageUrl: dataUrl });
          if (!imgRes?.ok) log("Image " + d.file.name + " failed: " + imgRes?.error, "error");
          else log("Image " + (i+1) + "/" + matchedDesigns.length + " sent: " + d.file.name, "info");
        }

        // Start upload
        const startRes = await sendMsg({ type: "QUEUE_START" });
        if (!startRes?.ok) throw new Error(startRes?.error || "start failed");
        log("Upload STARTED — check the extension popup for progress", "success");
      } catch (e) {
        log("ERROR: " + e.message, "error");
      }
      startBtn.disabled = false;
    });

    function fileToDataUrl(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(file);
      });
    }

    function log(msg, type) {
      const cls = type === "error" ? "error" : type === "success" ? "success" : "info";
      status.innerHTML += `<span class="${cls}">${new Date().toLocaleTimeString()} ${msg}</span>\n`;
      status.scrollTop = status.scrollHeight;
    }

    // ── Clear ──
    clearBtn.addEventListener("click", () => {
      csvRows = []; pngFiles = []; matchedDesigns = [];
      csvInput.value = ""; pngInput.value = "";
      csvInfo.textContent = ""; pngInfo.textContent = "";
      matchedInfo.textContent = ""; preview.innerHTML = "";
      status.innerHTML = ""; startBtn.disabled = true;
    });
  </script>
  <footer style="text-align:center;font-size:10px;color:#555;padding:12px 0 4px;border-top:1px solid #222;margin-top:16px;user-select:none">
    © SaiedPod — All Rights Reserved
  </footer>
</body>
</html>
